[package]
name = "arcface-hrx"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "arcface inference with HRX and Loom"
repository = "https://github.com/zacharydenton/arcface-hrx"
include = ["src/**", "kernels/**", "tests/**", "docs/**", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]

[dependencies]
hrx = { package = "hrx-rs", version = "0.7.0" }
anyhow = "1"
half = { version = "2", features = ["bytemuck"] }
bytemuck = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
nalgebra = "0.34"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tract-onnx = "=0.22.1"
onnx-protobuf = "0.2.3"
# Test fixtures use the generated ONNX protobuf API directly.
protobuf = "=3.4.0"
